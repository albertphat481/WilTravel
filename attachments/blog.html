<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WILTravel - Blog Du Lịch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    html { scroll-behavior: smooth; }
    .blog-card { transition: all 0.3s ease; }
    .blog-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.2); }
    .fade-in { animation: fadeIn 0.4s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="font-sans bg-gray-50">

  <!-- Navbar -->
  <nav class="bg-white shadow-md fixed w-full z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html"><img src="images/logo.png" alt="WILTravel" class="h-9 sm:h-11 w-auto"></a>
      </div>
      
      <div class="hidden md:flex items-center gap-8 text-gray-700 font-medium">
        <a href="index.html" class="hover:text-green-600 transition">Trang chủ</a>
        <a href="tours.html" class="hover:text-green-600 transition">Tours</a>
        <a href="blog.html" class="text-green-600 font-semibold">Blog</a>
        <a href="contact.html" class="hover:text-green-600 transition">Liên Hệ</a>
        <a href="about.html" class="hover:text-green-600 transition">Về Chúng Tôi</a>
      </div>

      <div class="flex items-center gap-3">
        <a href="cart.html" class="text-gray-700 hover:text-green-600 transition text-lg"><i class="fa-solid fa-shopping-cart"></i></a>
        <a href="login.html" class="hidden md:inline-block px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-full transition text-sm">Đăng nhập</a>
        <a href="register.html" class="hidden md:inline-block bg-green-600 text-white px-5 py-2 rounded-full hover:bg-green-700 transition text-sm font-medium">Đăng ký</a>
      </div>

      <button id="mobile-menu-button" class="md:hidden text-3xl text-gray-700">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-white border-t">
      <div class="px-6 py-6 flex flex-col gap-5 text-gray-700 font-medium">
        <a href="index.html" class="hover:text-green-600 transition">Trang chủ</a>
        <a href="tours.html" class="hover:text-green-600 transition">Tours</a>
        <a href="blog.html" class="text-green-600 font-semibold transition">Blog</a>
        <a href="contact.html" class="hover:text-green-600 transition">Liên Hệ</a>
        <a href="about.html" class="hover:text-green-600 transition">Về Chúng Tôi</a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="bg-gradient-to-r from-green-600 to-emerald-700 text-white py-16 md:py-20 pt-24">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 text-center">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Blog Du Lịch</h1>
      <p class="text-lg text-green-100">Khám phá những kinh nghiệm và mẹo du lịch tuyệt vời</p>
    </div>
  </section>

  <!-- Search & Filter -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-col md:flex-row gap-4 items-center">
      <div class="flex-1 relative">
        <input type="text" id="search" placeholder="Tìm bài viết..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" oninput="filterAndRender()">
        <i class="fa-solid fa-search absolute right-4 top-3 text-gray-400"></i>
      </div>
      <select id="category" class="px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" onchange="filterAndRender()">
        <option value="">Tất Cả Chủ Đề</option>
        <option value="Du Lịch">Du Lịch</option>
        <option value="Điểm Đến">Điểm Đến</option>
        <option value="Mẹo">Mẹo Du Lịch</option>
        <option value="Chuyến Đi">Chuyến Đi</option>
        <option value="Ẩm Thực">Ẩm Thực</option>
      </select>
    </div>
  </section>

  <!-- Blog Posts (dynamic) -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 py-12">
    <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Posts rendered by JS -->
    </div>
  </section>

  <!-- Pagination (dynamic) -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 py-12 text-center">
    <div id="pagination" class="flex justify-center gap-2">
      <!-- Rendered by JS -->
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-400 py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
        <div>
          <a href="index.html"><img src="images/logo-footer-colored.png" alt="WILTravel" class="h-12 mb-4 bg-white/10 rounded-xl p-1"></a>
          <p class="text-sm">Chỉ cần & đi chuyến nghỉ ngơi</p>
        </div>
        <div>
          <h3 class="text-white font-semibold mb-4">Liên Hệ</h3>
          <p class="text-sm">72/10/6 Văn Chung, Tp.HCM<br>Hotline: 0905 025737</p>
        </div>
        <div>
          <h3 class="text-white font-semibold mb-4">Kết Nối</h3>
          <div class="flex gap-4 text-2xl">
            <i class="fa-brands fa-facebook hover:text-white cursor-pointer"></i>
            <i class="fa-brands fa-instagram hover:text-white cursor-pointer"></i>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/blog-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Load central blog database
    const blogPosts = window.blogPosts;

    const POSTS_PER_PAGE = 6;
    let currentPage = 1;
    let filteredPosts = [...blogPosts];

    function filterAndRender() {
      const searchVal = document.getElementById('search').value.toLowerCase();
      const catVal = document.getElementById('category').value;

      filteredPosts = blogPosts.filter(post => {
        const matchSearch = post.title.toLowerCase().includes(searchVal) || post.desc.toLowerCase().includes(searchVal);
        const matchCat = !catVal || post.category.includes(catVal);
        return matchSearch && matchCat;
      });

      currentPage = 1;
      renderBlog();
    }

    function renderBlog() {
      const grid = document.getElementById('blog-grid');
      const start = (currentPage - 1) * POSTS_PER_PAGE;
      const end = start + POSTS_PER_PAGE;
      const pagePosts = filteredPosts.slice(start, end);

      if (pagePosts.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-yellow-50 border border-yellow-200 rounded-2xl p-10 text-center text-yellow-800">
            <i class="fa-solid fa-search text-3xl mb-3 text-yellow-400"></i>
            <p class="font-semibold text-lg">Không tìm thấy bài viết phù hợp</p>
            <p class="text-sm mt-1 text-gray-500">Hãy thử từ khóa hoặc chủ đề khác.</p>
          </div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      grid.innerHTML = pagePosts.map(post => `
        <article class="blog-card bg-white rounded-2xl shadow-md overflow-hidden fade-in flex flex-col h-full border border-gray-100">
          <img src="${post.image}" alt="${post.title}" class="w-full h-48 object-cover shrink-0" loading="lazy">
          <div class="p-6 flex flex-col flex-grow">
            <span class="text-xs text-green-600 font-semibold uppercase tracking-wider">${post.category}</span>
            <h3 class="text-xl font-bold text-gray-800 mt-2 mb-2 line-clamp-2 h-14">${post.title}</h3>
            <p class="text-gray-600 text-sm mb-4 line-clamp-2 flex-grow">${post.desc}</p>
            <div class="flex justify-between items-center text-sm text-gray-500 pt-4 border-t border-gray-100 shrink-0">
              <span><i class="fa-solid fa-calendar mr-1"></i>${post.date}</span>
              <a href="blog-detail.html?id=${post.id}" class="text-green-600 font-semibold hover:underline">Đọc tiếp →</a>
            </div>
          </div>
        </article>
      `).join('');

      renderPagination();
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);
      const container = document.getElementById('pagination');

      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = '';

      // Previous button
      html += `<button onclick="goToPage(${currentPage - 1})" class="px-3 py-2 rounded-lg border border-gray-300 hover:bg-gray-100 transition ${currentPage === 1 ? 'opacity-40 pointer-events-none' : ''}" ${currentPage === 1 ? 'disabled' : ''}>
        <i class="fa-solid fa-chevron-left"></i>
      </button>`;

      for (let i = 1; i <= totalPages; i++) {
        const isActive = i === currentPage;
        html += `<button onclick="goToPage(${i})" class="px-4 py-2 rounded-lg transition font-semibold ${
          isActive ? 'bg-green-600 text-white shadow-lg shadow-green-600/30' : 'border border-gray-300 text-gray-700 hover:bg-gray-100'
        }">${i}</button>`;
      }

      // Next button
      html += `<button onclick="goToPage(${currentPage + 1})" class="px-3 py-2 rounded-lg border border-gray-300 hover:bg-gray-100 transition ${currentPage === totalPages ? 'opacity-40 pointer-events-none' : ''}" ${currentPage === totalPages ? 'disabled' : ''}>
        <i class="fa-solid fa-chevron-right"></i>
      </button>`;

      container.innerHTML = html;
    }

    function goToPage(page) {
      const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderBlog();
      // Scroll to blog grid smoothly
      const grid = document.getElementById('blog-grid');
      if (grid) {
        const yOffset = -100; 
        const y = grid.getBoundingClientRect().top + window.pageYOffset + yOffset;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
    }

    // Mobile menu
    const mobileButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    if (mobileButton) {
      mobileButton.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
    }

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      renderBlog();
    });
  </script>
</body>
</html>
