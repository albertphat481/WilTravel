<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WILTravel - Tài Khoản Cá Nhân</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            jakarta: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a', // original green
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .nav-tab.active { border-bottom: 3px solid #16a34a; color: #16a34a; }
  </style>
</head>
<body class="font-jakarta bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300">

  <nav class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-md fixed w-full z-50 border-b border-gray-100 dark:border-white/10 transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <img src="images/logo-transparent.png" alt="WILTravel" class="h-9 sm:h-11 w-auto dark:hidden">
        <img src="images/logo-footer.png" alt="WILTravel" class="h-9 sm:h-11 w-auto hidden dark:block">
      </a>
      <div class="flex gap-4">
        <a href="tours.html" class="text-gray-700 dark:text-slate-200 hover:text-primary-600 dark:text-primary-400">Mua Hàng</a>
        <a href="#" onclick="logout()" class="text-gray-700 dark:text-slate-200 hover:text-primary-600 dark:text-primary-400">Đăng Xuất</a>
      </div>
    </div>
  </nav>

  <section class="max-w-7xl mx-auto px-4 sm:px-6 py-12 pt-24">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
      <!-- Sidebar -->
      <div class="md:col-span-1">
        <div class="bg-white dark:bg-slate-800 rounded-lg shadow-md p-6">
          <div class="text-center mb-6">
            <div class="w-20 h-20 mx-auto bg-primary-600 dark:bg-primary-700 rounded-full flex items-center justify-center text-white text-3xl mb-4">
              <i class="fa-solid fa-user"></i>
            </div>
            <h3 class="font-bold text-gray-800 dark:text-slate-100">Nguyễn Văn A</h3>
            <p class="text-sm text-gray-600 dark:text-slate-300">nguyen@email.com</p>
          </div>

          <div class="space-y-3">
            <button onclick="switchTab('profile')" class="nav-tab active w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 dark:bg-slate-800 transition font-medium text-gray-700 dark:text-slate-200">
              <i class="fa-solid fa-user mr-2"></i>Hồ Sơ
            </button>
            <button onclick="switchTab('bookings')" class="nav-tab w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 dark:bg-slate-800 transition font-medium text-gray-700 dark:text-slate-200">
              <i class="fa-solid fa-bookmark mr-2"></i>Đơn Đặt
            </button>
            <button onclick="switchTab('settings')" class="nav-tab w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 dark:bg-slate-800 transition font-medium text-gray-700 dark:text-slate-200">
              <i class="fa-solid fa-gear mr-2"></i>Cài Đặt
            </button>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="md:col-span-3">
        <!-- Profile Tab -->
        <div id="profile-tab" class="bg-white dark:bg-slate-800 rounded-lg shadow-md p-8">
          <h2 class="text-2xl font-bold text-gray-800 dark:text-slate-100 mb-6">Thông Tin Cá Nhân</h2>
          <form onsubmit="updateProfile(event)" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-semibold text-gray-700 dark:text-slate-200 mb-2">Họ</label>
                <input type="text" id="profile-lastname" required class="w-full px-4 py-3 border border-gray-300 rounded-lg">
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 dark:text-slate-200 mb-2">Tên</label>
                <input type="text" id="profile-firstname" required class="w-full px-4 py-3 border border-gray-300 rounded-lg">
              </div>
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 dark:text-slate-200 mb-2">Email (Không thể thay đổi)</label>
              <input type="email" id="profile-email" readonly class="w-full px-4 py-3 border border-gray-200 rounded-lg bg-gray-50 dark:bg-slate-800/50 text-gray-500 dark:text-slate-400 cursor-not-allowed">
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 dark:text-slate-200 mb-2">Số Điện Thoại</label>
              <input type="tel" id="profile-phone" required class="w-full px-4 py-3 border border-gray-300 rounded-lg">
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 dark:text-slate-200 mb-2">Địa Chỉ</label>
              <input type="text" id="profile-address" required class="w-full px-4 py-3 border border-gray-300 rounded-lg">
            </div>

            <button type="submit" class="bg-primary-600 dark:bg-primary-700 text-white font-bold py-3 px-6 rounded-lg hover:bg-primary-700 dark:hover:bg-primary-600 transition">
              Cập Nhật Thông Tin
            </button>
          </form>
        </div>

        <!-- Bookings Tab -->
        <div id="bookings-tab" class="hidden">
          <h2 class="text-2xl font-bold text-gray-800 dark:text-slate-100 mb-6">Lịch Sử Đặt Tour</h2>
          <div id="orders-list" class="space-y-4">
            <!-- Sẽ được tải động -->
          </div>
        </div>

        <!-- Settings Tab -->
        <div id="settings-tab" class="hidden">
          <h2 class="text-2xl font-bold text-gray-800 dark:text-slate-100 mb-6">Cài Đặt</h2>
          <div class="space-y-6">
            <div class="bg-white dark:bg-slate-800 rounded-lg shadow-md p-6">
              <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-gray-800 dark:text-slate-100">Nhận Thông Báo Email</h3>
                <input type="checkbox" checked class="w-5 h-5 accent-green-600">
              </div>
              <p class="text-sm text-gray-600 dark:text-slate-300">Nhận email khi có ưu đãi mới</p>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-lg shadow-md p-6">
              <h3 class="font-bold text-gray-800 dark:text-slate-100 mb-4">Đổi Mật Khẩu</h3>
              <div class="space-y-4">
                <input type="password" id="pwd-current" placeholder="Mật khẩu hiện tại" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                <input type="password" id="pwd-new" placeholder="Mật khẩu mới" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                <input type="password" id="pwd-confirm" placeholder="Xác nhận mật khẩu" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                <button type="button" onclick="changePassword()" class="bg-primary-600 dark:bg-primary-700 text-white font-bold py-2 px-4 rounded-lg hover:bg-primary-700 dark:hover:bg-primary-600">
                  Đổi Mật Khẩu
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll('[id$="-tab"]').forEach(el => el.classList.add('hidden'));
      document.getElementById(tab + '-tab').classList.remove('hidden');
      
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      event.target.closest('.nav-tab').classList.add('active');
    }

    function initProfile() {
      const user = getCurrentUser();
      if (!user) {
        alert('Vui lòng đăng nhập để xem thông tin tài khoản!');
        window.location.href = 'login.html';
        return;
      }

      // Prefill Profile form
      document.getElementById('profile-lastname').value = user.lastName || '';
      document.getElementById('profile-firstname').value = user.firstName || '';
      document.getElementById('profile-email').value = user.email || '';
      document.getElementById('profile-phone').value = user.phone || '';
      document.getElementById('profile-address').value = user.address || '';

      // Update sidebar name
      document.querySelector('.md\\:col-span-1 h3').textContent = `${user.lastName} ${user.firstName}`;
      document.querySelector('.md\\:col-span-1 p').textContent = user.email;

      renderBookings();
    }

    function updateProfile(e) {
      e.preventDefault();
      const user = getCurrentUser();
      if (!user) return;
      
      user.lastName = document.getElementById('profile-lastname').value.trim();
      user.firstName = document.getElementById('profile-firstname').value.trim();
      user.phone = document.getElementById('profile-phone').value.trim();
      user.address = document.getElementById('profile-address').value.trim();
      
      setCurrentUser(user);
      
      // Update in users registry
      const users = getUsers();
      const idx = users.findIndex(u => u.email === user.email);
      if (idx > -1) {
        users[idx] = user;
        localStorage.setItem('wil_users', JSON.stringify(users));
      }
      
      alert('✅ Cập nhật thông tin cá nhân thành công!');
      location.reload();
    }

    function changePassword() {
      const curPass = document.getElementById('pwd-current').value;
      const newPass = document.getElementById('pwd-new').value;
      const confPass = document.getElementById('pwd-confirm').value;

      const user = getCurrentUser();
      if (!user) return;

      if (curPass !== user.password) {
        alert('✗ Mật khẩu hiện tại không chính xác!');
        return;
      }
      if (newPass.length < 6) {
        alert('✗ Mật khẩu mới phải có ít nhất 6 ký tự!');
        return;
      }
      if (newPass !== confPass) {
        alert('✗ Xác nhận mật khẩu mới không khớp!');
        return;
      }

      user.password = newPass;
      setCurrentUser(user);
      
      const users = getUsers();
      const idx = users.findIndex(u => u.email === user.email);
      if (idx > -1) {
        users[idx] = user;
        localStorage.setItem('wil_users', JSON.stringify(users));
      }
      
      alert('✅ Đổi mật khẩu thành công!');
      document.getElementById('pwd-current').value = '';
      document.getElementById('pwd-new').value = '';
      document.getElementById('pwd-confirm').value = '';
    }

    function renderBookings() {
      const orders = getOrders();
      const container = document.getElementById('orders-list');
      
      if (orders.length === 0) {
        container.innerHTML = `
          <div class="bg-white dark:bg-slate-800 rounded-xl p-8 text-center text-gray-500 dark:text-slate-400 border border-gray-100 shadow-sm">
            Chưa có đơn đặt tour nào.
          </div>`;
        return;
      }

      container.innerHTML = orders.map(ord => {
        const tour = tours.find(t => t.id === ord.tourId);
        const tourName = tour ? tour.name : `Tour #${ord.tourId}`;
        const statusClass = ord.status === 'Hoàn Tất' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800';
        return `
          <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-6 border border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h3 class="font-bold text-gray-800 dark:text-slate-100 hover:text-primary-600 dark:text-primary-400 cursor-pointer text-base sm:text-lg" onclick="window.location.href='tour-detail.html?id=${ord.tourId}'">${tourName}</h3>
              <p class="text-xs text-gray-400 mt-1">Mã đơn: ${ord.orderId}</p>
              <p class="text-xs text-gray-500 dark:text-slate-400 mt-1"><i class="fa-solid fa-calendar mr-1"></i>Ngày đi: ${ord.date} • Số lượng: ${ord.quantity}</p>
            </div>
            <div class="text-left sm:text-right w-full sm:w-auto border-t sm:border-0 pt-3 sm:pt-0">
              <p class="text-xl font-bold text-primary-600 dark:text-primary-400">${ord.total.toLocaleString('vi-VN')}đ</p>
              <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold ${statusClass} mt-2">${ord.status}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function logout() {
      if (confirm('Bạn chắc chắn muốn đăng xuất?')) {
        logoutUser();
      }
    }

    window.onload = () => {
      initProfile();
    };
  </script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof AOS !== 'undefined') {
        AOS.init({ duration: 800, once: true });
      }
    });
  </script>
</body>
</html>
