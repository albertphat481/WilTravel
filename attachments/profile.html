<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WILTravel - Tài Khoản Cá Nhân</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .nav-tab.active { border-bottom: 3px solid #16a34a; color: #16a34a; }
  </style>
</head>
<body class="font-sans bg-gray-50">

  <nav class="bg-white shadow-md fixed w-full z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
      <a href="index.html"><img src="images/logo.png" alt="WILTravel" class="h-10 w-auto"></a>
      <div class="flex gap-4">
        <a href="tours.html" class="text-gray-700 hover:text-green-600">Mua Hàng</a>
        <a href="#" onclick="logout()" class="text-gray-700 hover:text-green-600">Đăng Xuất</a>
      </div>
    </div>
  </nav>

  <section class="max-w-7xl mx-auto px-4 sm:px-6 py-12 pt-24">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
      <!-- Sidebar -->
      <div class="md:col-span-1">
        <div class="bg-white rounded-lg shadow-md p-6">
          <div class="text-center mb-6">
            <div class="w-20 h-20 mx-auto bg-green-600 rounded-full flex items-center justify-center text-white text-3xl mb-4">
              <i class="fa-solid fa-user"></i>
            </div>
            <h3 class="font-bold text-gray-800">Nguyễn Văn A</h3>
            <p class="text-sm text-gray-600">nguyen@email.com</p>
          </div>

          <div class="space-y-3">
            <button onclick="switchTab('profile')" class="nav-tab active w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 transition font-medium text-gray-700">
              <i class="fa-solid fa-user mr-2"></i>Hồ Sơ
            </button>
            <button onclick="switchTab('bookings')" class="nav-tab w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 transition font-medium text-gray-700">
              <i class="fa-solid fa-bookmark mr-2"></i>Đơn Đặt
            </button>
            <button onclick="switchTab('settings')" class="nav-tab w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 transition font-medium text-gray-700">
              <i class="fa-solid fa-gear mr-2"></i>Cài Đặt
            </button>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="md:col-span-3">
        <!-- Profile Tab -->
        <div id="profile-tab" class="bg-white rounded-lg shadow-md p-8">
          <h2 class="text-2xl font-bold text-gray-800 mb-6">Thông Tin Cá Nhân</h2>
          <form class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Họ</label>
                <input type="text" value="Nguyễn" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
              </div>
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Tên</label>
                <input type="text" value="Văn A" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
              </div>
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
              <input type="email" value="nguyen@email.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Số Điện Thoại</label>
              <input type="tel" value="0901 234 567" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Địa Chỉ</label>
              <input type="text" value="123 Đường ABC, TP.HCM" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
            </div>

            <button type="submit" class="bg-green-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-green-700 transition">
              Cập Nhật Thông Tin
            </button>
          </form>
        </div>

        <!-- Bookings Tab -->
        <div id="bookings-tab" class="hidden">
          <h2 class="text-2xl font-bold text-gray-800 mb-6">Lịch Sử Đặt Tour</h2>
          <div class="space-y-4">
            <div class="bg-white rounded-lg shadow-md p-6 flex justify-between items-center">
              <div>
                <h3 class="font-bold text-gray-800">Phú Quốc 4N3Đ</h3>
                <p class="text-sm text-gray-600">Đặt ngày: 01/06/2026</p>
              </div>
              <div class="text-right">
                <p class="text-2xl font-bold text-green-600">3.29tr</p>
                <span class="inline-block bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-semibold">Chờ Xác Nhận</span>
              </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6 flex justify-between items-center">
              <div>
                <h3 class="font-bold text-gray-800">Sapa - Hà Giang 5N4Đ</h3>
                <p class="text-sm text-gray-600">Đặt ngày: 25/05/2026</p>
              </div>
              <div class="text-right">
                <p class="text-2xl font-bold text-green-600">4.19tr</p>
                <span class="inline-block bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-semibold">Hoàn Tất</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Settings Tab -->
        <div id="settings-tab" class="hidden">
          <h2 class="text-2xl font-bold text-gray-800 mb-6">Cài Đặt</h2>
          <div class="space-y-6">
            <div class="bg-white rounded-lg shadow-md p-6">
              <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-gray-800">Nhận Thông Báo Email</h3>
                <input type="checkbox" checked class="w-5 h-5 accent-green-600">
              </div>
              <p class="text-sm text-gray-600">Nhận email khi có ưu đãi mới</p>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
              <h3 class="font-bold text-gray-800 mb-4">Đổi Mật Khẩu</h3>
              <div class="space-y-4">
                <input type="password" placeholder="Mật khẩu hiện tại" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                <input type="password" placeholder="Mật khẩu mới" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                <input type="password" placeholder="Xác nhận mật khẩu" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                <button type="button" class="bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700">
                  Đổi Mật Khẩu
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('[id$="-tab"]').forEach(el => el.classList.add('hidden'));
      document.getElementById(tab + '-tab').classList.remove('hidden');
      
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      event.target.closest('.nav-tab').classList.add('active');
    }

    function logout() {
      if (confirm('Bạn chắc chắn muốn đăng xuất?')) {
        window.location.href = 'login.html';
      }
    }
  </script>
</body>
</html>
