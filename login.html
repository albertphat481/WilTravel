<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WILTravel - Đăng nhập</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .login-bg {
      background-size: cover;
      background-position: center;
      transition: background-image 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 100vh;
    }

    @media (max-width: 768px) {
      .login-bg {
        background-position: center;
      }
    }
  </style>
</head>
<body class="font-sans">

  <div id="login-bg" class="login-bg flex items-center justify-center p-4 sm:p-6">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden relative">

      <!-- Nút Quay lại -->
      <a href="index.html" 
         class="absolute top-6 left-6 flex items-center gap-2 text-white hover:text-green-300 transition z-10 bg-black/30 px-4 py-2 rounded-full backdrop-blur-sm">
        <i class="fa-solid fa-arrow-left text-xl"></i>
        <span class="font-medium">Quay lại</span>
      </a>

      <div class="p-8 text-center border-b pt-16">
        <img src="images/logo.png" alt="WILTravel" class="h-12 mx-auto mb-4">
        <h1 class="text-2xl font-bold text-gray-800">Chào mừng trở lại</h1>
        <p class="text-gray-500 mt-1">Đăng nhập để tiếp tục hành trình</p>
      </div>

      <div class="p-8 space-y-6">
        <div id="googleButton" class="flex justify-center"></div>

        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white text-gray-500">Hoặc đăng nhập thường</span>
          </div>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Email hoặc Số điện thoại</label>
            <input type="text" id="email" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500" placeholder="example@email.com" required>
          </div>
          <div class="mb-6 relative">
            <label class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu</label>
            <input type="password" id="password" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500 pr-12" placeholder="••••••••" required>
            <button type="button" onclick="togglePassword()" class="absolute right-5 top-11 text-gray-400 hover:text-gray-600">
              <i id="eye-icon" class="fa-solid fa-eye"></i>
            </button>
          </div>

          <div class="flex items-center justify-between mb-6">
            <label class="flex items-center cursor-pointer">
              <input type="checkbox" class="w-4 h-4 accent-green-600">
              <span class="ml-2 text-sm text-gray-600">Ghi nhớ tôi</span>
            </label>
            <a href="#" onclick="showForgotPassword()" class="text-green-600 hover:underline text-sm font-medium">
              Quên mật khẩu?
            </a>
          </div>

          <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-4 rounded-2xl text-lg">
            Đăng nhập
          </button>
        </form>
      </div>

      <div class="p-6 bg-gray-50 text-center border-t">
        <p class="text-gray-600">
          Chưa có tài khoản? 
          <a href="register.html" class="text-green-600 font-semibold hover:underline">Đăng ký ngay</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Modal Quên Mật Khẩu -->
<div id="forgotModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50" onclick="closeForgotModal()">
      <div onclick="event.stopPropagation()" class="bg-white rounded-3xl p-8 max-w-md w-full mx-4">
      <h2 class="text-2xl font-bold text-gray-800 mb-2">Quên mật khẩu?</h2>
      <p class="text-gray-600 mb-6">Nhập email của bạn để nhận link đặt lại mật khẩu.</p>
      
      <input type="email" id="forgot-email" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500 mb-6" placeholder="example@email.com">

      <button onclick="sendResetLink()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-4 rounded-2xl text-lg mb-4">
        Gửi link đặt lại mật khẩu
      </button>
      
      <button onclick="closeForgotModal()" class="w-full text-gray-600 hover:bg-gray-100 py-4 rounded-2xl text-lg">
        Đóng
      </button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const GOOGLE_CLIENT_ID = "1038953243276-ef3mtk9jmsbhkjsip1v1ibgluvbsqb.apps.googleusercontent.com";

    // Enhanced Background Carousel
    const bgImages = [
      "images/hero1.jpg",
      "images/hero2.jpg",
      "images/hero3.jpg",
      "images/hero4.jpg",
      "images/hero5.jpg",
      "images/hero6.jpg",
      "images/hero7.jpg",
      "images/hero8.jpg",
      "images/login-bg1.jpg",
      "images/login-bg2.jpg",
      "images/login-bg3.jpg",
      "images/login-bg4.jpg",
      "images/login-bg5.jpg",
      "images/login-bg6.jpg"
    ];
    const gradients = [
      "linear-gradient(135deg, #0f4c75 0%, #1b6ca8 100%)",
      "linear-gradient(135deg, #134e5e 0%, #71b280 100%)",
      "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)",
      "linear-gradient(135deg, #16a085 0%, #f4d03f 100%)",
      "linear-gradient(135deg, #c0392b 0%, #e74c3c 100%)",
      "linear-gradient(135deg, #8e44ad 0%, #c0392b 100%)",
      "linear-gradient(135deg, #2980b9 0%, #6dd5fa 100%)",
      "linear-gradient(135deg, #0f2027 0%, #2c5364 100%)",
      "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
      "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)",
      "linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)",
      "linear-gradient(135deg, #fa709a 0%, #fee140 100%)",
      "linear-gradient(135deg, #30cfd0 0%, #330867 100%)",
      "linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)"
    ];
    
    let currentBg = 0;
    let autoPlayInterval;
    let isAutoPlaying = true;
    const loginBg = document.getElementById('login-bg');

    function changeBackground() {
      currentBg = (currentBg + 1) % bgImages.length;
      const bgImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${bgImages[currentBg]}'), ${gradients[currentBg]}`;
      loginBg.style.backgroundImage = bgImage;
      loginBg.style.backgroundSize = 'cover';
      loginBg.style.backgroundPosition = 'center';
    }

    function startAutoPlay() {
      if (!isAutoPlaying) return;
      autoPlayInterval = setInterval(changeBackground, 4000);
    }

    function stopAutoPlay() {
      clearInterval(autoPlayInterval);
    }

    function resetAutoPlay() {
      stopAutoPlay();
      if (isAutoPlaying) startAutoPlay();
    }

    // Pause on hover
    loginBg.addEventListener('mouseenter', stopAutoPlay);
    loginBg.addEventListener('mouseleave', resetAutoPlay);

    // Google Login
    function handleCredentialResponse(response) {
      console.log("Google Token:", response.credential);
      // Simulating Google login
      const demoUser = { firstName: "Google User", lastName: "G-User", email: "google@user.com", phone: "", password: "" };
      setCurrentUser(demoUser);
      showSuccessMessage();
    }

    function showSuccessMessage() {
      const html = `
        <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
          <div class="bg-white rounded-3xl p-10 text-center max-w-sm">
            <i class="fa-solid fa-circle-check text-green-500 text-6xl mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-800">Đăng nhập thành công!</h2>
            <p class="text-gray-600 mt-2">Đang chuyển về trang chủ...</p>
          </div>
        </div>`;
      document.body.insertAdjacentHTML('beforeend', html);
      setTimeout(() => window.location.href = "index.html", 1500);
    }

    function initializeGoogle() {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        { theme: "outline", size: "large", width: "100%", text: "continue_with", shape: "pill" }
      );
    }

    // Toggle Password
    function togglePassword() {
      const pass = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pass.type === "password") {
        pass.type = "text";
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pass.type = "password";
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    // Forgot Password Modal
    function showForgotPassword() {
      document.getElementById('forgotModal').classList.remove('hidden');
    }

    function closeForgotModal() {
      document.getElementById('forgotModal').classList.add('hidden');
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function sendResetLink() {
      const email = document.getElementById('forgot-email').value.trim();
      if (!email) {
        alert("Vui lòng nhập email!");
        return;
      }
      if (!validateEmail(email)) {
        alert("Vui lòng nhập định dạng email hợp lệ!");
        return;
      }
      alert(`✅ Link đặt lại mật khẩu đã được gửi đến: ${email}`);
      closeForgotModal();
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!validateEmail(email)) {
        alert('Vui lòng nhập email hợp lệ!');
        return;
      }

      const res = loginUser(email, password);
      if (res.success) {
        showSuccessMessage();
      } else {
        alert('✗ Đăng nhập thất bại: ' + res.message);
      }
    }

    function handleEscapeKey(event) {
      if (event.key === 'Escape') {
        closeForgotModal();
      }
    }

    // Khởi tạo
    window.onload = () => {
      initializeGoogle();
      changeBackground(); // Initialize first background
      startAutoPlay(); // Start enhanced carousel
      document.addEventListener('keydown', handleEscapeKey);
      
      // Auto pre-fill demo details for convenience
      document.getElementById('email').value = 'nguyen@email.com';
      document.getElementById('password').value = '123456';
    };
  </script>
</body>
</html>
