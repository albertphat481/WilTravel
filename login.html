<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WILTravel - Đăng nhập</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .login-bg {
      background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://your-vercel-domain/images/hero1.jpg');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body class="font-sans">

  <div class="min-h-screen login-bg flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
      <div class="p-8 text-center border-b">
        <img src="https://your-vercel-domain/images/logo.png" alt="WILTravel" class="h-12 mx-auto mb-4">
        <h1 class="text-2xl font-bold text-gray-800">Chào mừng trở lại</h1>
        <p class="text-gray-500 mt-1">Đăng nhập để tiếp tục hành trình</p>
      </div>

      <div class="p-8 space-y-6">
        <div id="googleButton" class="flex justify-center"></div>

        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white text-gray-500">Hoặc đăng nhập thường</span>
          </div>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Email hoặc Số điện thoại</label>
            <input type="text" id="email" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500" placeholder="example@email.com" required>
          </div>
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu</label>
            <input type="password" id="password" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500" placeholder="••••••••" required>
          </div>
          <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-4 rounded-2xl text-lg">
            Đăng nhập
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = "1038953243276-ef3mtk9jmsbhkjsip1v1ibgluvbsqb.apps.googleusercontent.com"; // Dán Client ID của bạn vào đây

    function handleCredentialResponse(response) {
      console.log("Google Token:", response.credential);
      showSuccessMessage();
    }

    function showSuccessMessage() {
      const html = `
        <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
          <div class="bg-white rounded-3xl p-10 text-center max-w-sm">
            <i class="fa-solid fa-circle-check text-green-500 text-6xl mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-800">Đăng nhập thành công!</h2>
            <p class="text-gray-600 mt-2">Đang chuyển về trang chủ...</p>
          </div>
        </div>`;
      document.body.insertAdjacentHTML('beforeend', html);
      setTimeout(() => window.location.href = "/", 1500);
    }

    function initializeGoogle() {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        { 
          theme: "outline", 
          size: "large", 
          width: "100%", 
          text: "continue_with",
          shape: "pill"
        }
      );
    }

    window.onload = initializeGoogle;

    function handleLogin(e) {
      e.preventDefault();
      showSuccessMessage();
    }
  </script>
</body>
</html>
