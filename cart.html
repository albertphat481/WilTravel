<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WILTravel - Giỏ Hàng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="font-sans bg-gray-50">

  <nav class="bg-white shadow-md fixed w-full z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
      <a href="index.html"><img src="images/logo.png" alt="WILTravel" class="h-10 w-auto"></a>
      <a href="tours.html" class="text-gray-700 hover:text-green-600">Quay Lại Mua Hàng</a>
      <div class="flex gap-3">
        <a href="profile.html" class="text-gray-700 hover:text-green-600"><i class="fa-solid fa-user text-lg"></i></a>
      </div>
    </div>
  </nav>

  <section class="max-w-7xl mx-auto px-4 sm:px-6 py-16 pt-24">
    <h1 class="text-4xl font-bold text-gray-800 mb-8">Giỏ Hàng</h1>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <div class="lg:col-span-2">
        <div id="cart-items" class="space-y-4">
          <div class="bg-white rounded-lg p-6 text-center text-gray-500">
            <i class="fa-solid fa-shopping-cart text-4xl mb-4 opacity-30"></i>
            <p>Giỏ hàng của bạn trống</p>
            <a href="tours.html" class="inline-block mt-4 bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">Tiếp Tục Mua</a>
          </div>
        </div>
      </div>

      <div class="lg:col-span-1">
        <div class="bg-white rounded-lg shadow-md p-6 sticky top-24">
          <h2 class="text-2xl font-bold text-gray-800 mb-6">Tóm Tắt Đơn Hàng</h2>
          <div class="space-y-3 pb-4 border-b">
            <div class="flex justify-between text-gray-700">
              <span>Tổng tiền tour:</span>
              <span id="subtotal">0đ</span>
            </div>
            <div class="flex justify-between text-gray-700">
              <span>Phí dịch vụ:</span>
              <span id="fee">0đ</span>
            </div>
          </div>
          <div class="flex justify-between mt-4 text-xl font-bold text-gray-800 mb-6">
            <span>Tổng:</span>
            <span id="total" class="text-green-600">0đ</span>
          </div>
          <a href="booking.html" class="w-full block text-center bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">
            Tiếp Tục Thanh Toán
          </a>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
