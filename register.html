<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WILTravel - Đăng ký</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .register-bg {
      background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('images/hero2.jpg');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body class="font-sans">

  <div class="min-h-screen register-bg flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
      <div class="p-8 text-center border-b">
        <img src="images/logo.png" alt="WILTravel" class="h-12 mx-auto mb-4">
        <h1 class="text-2xl font-bold text-gray-800">Tạo tài khoản mới</h1>
        <p class="text-gray-500 mt-1">Tham gia cùng WILTravel ngay hôm nay</p>
      </div>

      <div class="p-8 space-y-6">
        <!-- Google Sign Up -->
        <div id="googleButton" class="flex justify-center"></div>

        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white text-gray-500">Hoặc đăng ký bằng email</span>
          </div>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Họ</label>
              <input type="text" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Tên</label>
              <input type="text" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500" required>
            </div>
          </div>

          <div class="mt-5">
            <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input type="email" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500" required>
          </div>

          <div class="mt-5">
            <label class="block text-sm font-medium text-gray-700 mb-2">Số điện thoại</label>
            <input type="tel" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500" required>
          </div>

          <div class="mt-5">
            <label class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu</label>
            <input type="password" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500" required>
          </div>

          <button type="submit" class="w-full mt-8 bg-green-600 hover:bg-green-700 text-white font-semibold py-4 rounded-2xl text-lg">
            Đăng ký
          </button>
        </form>
      </div>

      <div class="p-6 bg-gray-50 text-center border-t">
        <p class="text-gray-600">
          Đã có tài khoản? 
          <a href="login.html" class="text-green-600 font-semibold hover:underline">Đăng nhập</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = "1038953243276-ef3mtk9jmsbhkjsip1v1ibgluvbsqb.apps.googleusercontent.com"; // Thay bằng Client ID thật của bạn

    function handleCredentialResponse(response) {
      console.log("Google Token:", response.credential);
      alert("🎉 Đăng ký bằng Google thành công!");
      setTimeout(() => window.location.href = "index.html", 1500);
    }

    function initializeGoogle() {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        { theme: "outline", size: "large", width: "100%", text: "signup_with" }
      );
    }

    window.onload = initializeGoogle;

    function handleRegister(e) {
      e.preventDefault();
      alert("🎉 Đăng ký tài khoản thành công!\nChào mừng bạn đến với WILTravel!");
      setTimeout(() => window.location.href = "index.html", 1500);
    }
  </script>
</body>
</html>
