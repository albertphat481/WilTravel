<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WILTravel - Đăng ký</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .register-bg {
      background-size: cover;
      background-position: center;
      transition: background-image 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 100vh;
    }

    @media (max-width: 768px) {
      .register-bg {
        background-position: center;
      }
    }
  </style>
</head>
<body class="font-sans">

  <div id="register-bg" class="register-bg flex items-center justify-center p-4 sm:p-6">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden relative">

      <!-- Nút Quay lại -->
      <a href="index.html" 
         class="absolute top-6 left-6 flex items-center gap-2 text-white hover:text-green-300 transition z-10 bg-black/30 px-4 py-2 rounded-full backdrop-blur-sm">
        <i class="fa-solid fa-arrow-left text-xl"></i>
        <span class="font-medium">Quay lại</span>
      </a>

      <div class="p-8 text-center border-b pt-16">
        <img src="images/logo.png" alt="WILTravel" class="h-12 mx-auto mb-4">
        <h1 class="text-2xl font-bold text-gray-800">Tạo tài khoản mới</h1>
        <p class="text-gray-500 mt-1">Tham gia cùng WILTravel ngay hôm nay</p>
      </div>

      <div class="p-8 space-y-6">
        <!-- Google Sign Up -->
        <div id="googleButton" class="flex justify-center"></div>

        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white text-gray-500">Hoặc đăng ký bằng email</span>
          </div>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Họ</label>
              <input type="text" id="first-name" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Tên</label>
              <input type="text" id="last-name" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500" required>
            </div>
          </div>

          <div class="mt-5">
            <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input type="email" id="register-email" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500" required>
          </div>

          <div class="mt-5">
            <label class="block text-sm font-medium text-gray-700 mb-2">Số điện thoại</label>
            <div class="flex gap-3">
              <select id="country-code" class="w-32 px-4 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500">
                <option value="+84">+84 (Việt Nam)</option>
                <option value="+1">+1 (Mỹ/Canada)</option>
                <option value="+44">+44 (Anh)</option>
                <option value="+81">+81 (Nhật Bản)</option>
                <option value="+86">+86 (Trung Quốc)</option>
                <option value="+91">+91 (Ấn Độ)</option>
              </select>
              <input type="tel" id="phone" class="flex-1 px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500" placeholder="905 025 737" required>
            </div>
          </div>

          <div class="mt-5 relative">
            <label class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu</label>
            <input type="password" id="password" oninput="checkPasswordStrength()" class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500 pr-12" required>
            <button type="button" onclick="togglePassword()" class="absolute right-5 top-11 text-gray-400 hover:text-gray-600">
              <i id="eye-icon" class="fa-solid fa-eye"></i>
            </button>
            <p id="password-strength" class="text-sm text-gray-500 mt-2">Mật khẩu nên gồm ít nhất 8 ký tự, chữ hoa và số.</p>
          </div>

          <button type="submit" class="w-full mt-8 bg-green-600 hover:bg-green-700 text-white font-semibold py-4 rounded-2xl text-lg">
            Đăng ký
          </button>
        </form>
      </div>

      <div class="p-6 bg-gray-50 text-center border-t">
        <p class="text-gray-600">
          Đã có tài khoản? 
          <a href="login.html" class="text-green-600 font-semibold hover:underline">Đăng nhập</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const GOOGLE_CLIENT_ID = "1038953243276-ef3mtk9jmsbhkjsip1v1ibgluvbsqb.apps.googleusercontent.com";

    // Enhanced Background Carousel cho Register
    const bgImages = [
      "images/hero1.jpg",
      "images/hero2.jpg",
      "images/hero3.jpg",
      "images/hero4.jpg",
      "images/hero5.jpg",
      "images/hero6.jpg",
      "images/hero7.jpg",
      "images/hero8.jpg",
      "images/login-bg1.jpg",
      "images/login-bg2.jpg",
      "images/login-bg3.jpg",
      "images/login-bg4.jpg",
      "images/login-bg5.jpg",
      "images/login-bg6.jpg"
    ];
    const gradients = [
      "linear-gradient(135deg, #0f4c75 0%, #1b6ca8 100%)",
      "linear-gradient(135deg, #134e5e 0%, #71b280 100%)",
      "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)",
      "linear-gradient(135deg, #16a085 0%, #f4d03f 100%)",
      "linear-gradient(135deg, #c0392b 0%, #e74c3c 100%)",
      "linear-gradient(135deg, #8e44ad 0%, #c0392b 100%)",
      "linear-gradient(135deg, #2980b9 0%, #6dd5fa 100%)",
      "linear-gradient(135deg, #0f2027 0%, #2c5364 100%)",
      "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
      "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)",
      "linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)",
      "linear-gradient(135deg, #fa709a 0%, #fee140 100%)",
      "linear-gradient(135deg, #30cfd0 0%, #330867 100%)",
      "linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)"
    ];
    let currentBg = 0;
    let autoPlayInterval;
    let isAutoPlaying = true;
    const registerBg = document.getElementById('register-bg');

    function changeBackground() {
      currentBg = (currentBg + 1) % bgImages.length;
      const bgImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${bgImages[currentBg]}'), ${gradients[currentBg]}`;
      registerBg.style.backgroundImage = bgImage;
      registerBg.style.backgroundSize = 'cover';
      registerBg.style.backgroundPosition = 'center';
    }

    function startAutoPlay() {
      if (!isAutoPlaying) return;
      autoPlayInterval = setInterval(changeBackground, 4000);
    }

    function stopAutoPlay() {
      clearInterval(autoPlayInterval);
    }

    function resetAutoPlay() {
      stopAutoPlay();
      if (isAutoPlaying) startAutoPlay();
    }

    // Pause on hover
    registerBg.addEventListener('mouseenter', stopAutoPlay);
    registerBg.addEventListener('mouseleave', resetAutoPlay);

    function handleCredentialResponse(response) {
      console.log("Google Token:", response.credential);
      showRegisterSuccess();
    }

    function showRegisterSuccess() {
      const html = `
        <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
          <div class="bg-white rounded-3xl p-10 text-center max-w-sm">
            <i class="fa-solid fa-circle-check text-green-500 text-6xl mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-800">Đăng ký thành công!</h2>
            <p class="text-gray-600 mt-2">Đang chuyển sang trang đăng nhập...</p>
          </div>
        </div>`;
      document.body.insertAdjacentHTML('beforeend', html);
      
      setTimeout(() => {
        window.location.href = "login.html";
      }, 1800);
    }

    function initializeGoogle() {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        { theme: "outline", size: "large", width: "100%", text: "signup_with" }
      );
    }

    // Toggle Password Visibility
    function togglePassword() {
      const pass = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pass.type === "password") {
        pass.type = "text";
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pass.type = "password";
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    window.onload = () => {
      initializeGoogle();
      changeBackground(); // Initialize first background
      startAutoPlay(); // Start enhanced carousel
    };

    function handleRegister(e) {
      e.preventDefault();
      const firstName = document.getElementById('first-name').value.trim();
      const lastName = document.getElementById('last-name').value.trim();
      const email = document.getElementById('register-email').value.trim();
      const countryCode = document.getElementById('country-code').value;
      const phone = countryCode + ' ' + document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;

      // Register user through shared script
      const res = registerUser(firstName, lastName, email, phone, password);
      if (res.success) {
        showRegisterSuccess();
      } else {
        alert('✗ Đăng ký thất bại: ' + res.message);
      }
    }
  </script>
</body>
</html>
